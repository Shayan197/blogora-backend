version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blogora-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/blogora_db}
      - DATABASE_NAME=${DATABASE_NAME:-blogora_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-default_secret_for_local_docker_env}
      - DOMAIN=${DOMAIN:-http://localhost:3000}
      - EMAIL=${EMAIL:-support@blogora.dev}
      - EMAIL_PASS=${EMAIL_PASS:-dummy_app_password}
    networks:
      - blogora-network

  # Optional local PostgreSQL service for offline development
  postgres:
    image: postgres:16-alpine
    container_name: blogora-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blogora_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blogora-network
    profiles:
      - local-db

networks:
  blogora-network:
    driver: bridge

volumes:
  postgres_data:
